appId: de.nordavid.draftpilot
productName: Draftpilot
copyright: Copyright (c) 2026 David Einenkel

directories:
  # Je Version ein eigener Ordner: eine laufende aeltere Version blockiert den Build nicht.
  output: dist/${version}
  buildResources: build

# Alles ausser Quell-/Config-Dateien einpacken. out/ (Build-Output), package.json
# und die Produktions-Dependencies (ws) sind dadurch enthalten.
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.gitignore,.editorconfig,.prettierrc}'
  - '!{.env,.env.*,.npmrc}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{CLAUDE.md,README.md}'

# Nur die Chromium-Sprachpakete der App-Sprachen mitliefern (spart ~40 MB entpackt).
electronLanguages:
  - en-US
  - de

win:
  # Installer + portable EXE (ohne Installation, entpackt sich bei jedem Start).
  target:
    - nsis
    - portable
  icon: build/icon.ico
  # Kein Code-Signing-Zertifikat -> unsignierte EXEs (SmartScreen warnt einmalig).

portable:
  artifactName: ${productName} ${version} Portable.exe

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Draftpilot
